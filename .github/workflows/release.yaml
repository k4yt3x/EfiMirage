name: CD

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile (tags always use release)
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
          - noopt

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: archlinux:base-devel
    env:
      BUILD_PROFILE: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || inputs.profile }}

    steps:
      - name: Install build tools
        run: |
          pacman -Syu --noconfirm --needed \
            ca-certificates git just nasm python python-pip mingw-w64-gcc util-linux

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Checkout's safe.directory entry lives in a temporary config, not the later shell steps.
      - name: Trust checkout for container build steps
        run: |
          {
            printf 'GIT_CONFIG_COUNT=1\n'
            printf 'GIT_CONFIG_KEY_0=safe.directory\n'
            printf 'GIT_CONFIG_VALUE_0=%s\n' "$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"

      - name: Bootstrap pinned dependencies
        run: just bootstrap

      - name: Test and build
        run: just build "$BUILD_PROFILE"

      - name: Verify bundle
        run: just verify "$BUILD_PROFILE"

      - name: Upload deployment bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: efimirage-x64-${{ env.BUILD_PROFILE }}
          path: dist/${{ env.BUILD_PROFILE }}/
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cd-build-logs-${{ env.BUILD_PROFILE }}
          path: out/logs/*.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Extract changelog notes for this tag
        run: python3 scripts/release-notes.py -- "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      - name: Download verified deployment bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: efimirage-x64-release
          path: dist/release

      - name: Verify and package release assets
        run: |
          python3 scripts/artifacts.py verify release
          python3 -m zipfile --create efimirage-x64.zip dist/release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: efimirage-x64.zip
          fail_on_unmatched_files: true
