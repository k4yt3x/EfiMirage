name: Feature request
description: Suggest features, modifications or ideas
labels: ["feature"]

body:
  - type: markdown
    attributes:
      value: Before filing this EfiMirage request, search this repository's issues for an existing suggestion. If it has already been suggested, please add to the existing issue instead.

  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Briefly describe your idea, suggestion or proposed feature.
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation
      description: Thoughts on possible implementation details go here (optional).
      placeholder: Suggest how to implement the feature.
    validations:
      required: false
